name: Release

on:
  push:
    tags:
      - "v*"

# Prevent double-publish races for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # -----------------------------
      # Version validation (HARD GATE)
      # -----------------------------
      - name: Validate release version
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          echo "Releasing commit: $GITHUB_SHA"

          # mvn -q prints errors to stdout, so show the captured output on failure.
          if ! POM_VERSION="$(mvn -B -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive \
            org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)"; then
            echo "❌ Could not read the POM version:"
            echo "$POM_VERSION"
            exit 1
          fi

          echo "POM version: $POM_VERSION"

          if [[ "$POM_VERSION" == *"-SNAPSHOT" ]]; then
            echo "❌ Refusing to release a SNAPSHOT version"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$POM_VERSION" ]]; then
            echo "❌ Tag version ($TAG_VERSION) does not match POM version ($POM_VERSION)"
            exit 1
          fi

          echo "✅ Version check passed"

      - name: Guardrail reject old groupId
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --color=always 'io\.janbalangue' pom.xml async-bulkhead/pom.xml; then
            echo "❌ Found old groupId io.janbalangue in POMs"
            exit 1
          fi
          echo "✅ groupId guardrail passed"

      - name: Write Maven settings.xml
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          # Maven 3.10+ ties the id "central" to repo.maven.apache.org and sends these
          # credentials to no other host unless the deploy origins are listed here.
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_PASSWORD }}</password>
                <repositoryOrigins>
                  <repositoryOrigin>https://ossrh-staging-api.central.sonatype.com</repositoryOrigin>
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
          </settings>
          EOF

      - name: Configure GPG for non-interactive signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          cat > ~/.gnupg/gpg.conf <<'EOF'
          batch
          no-tty
          pinentry-mode loopback
          EOF

          cat > ~/.gnupg/gpg-agent.conf <<'EOF'
          allow-loopback-pinentry
          EOF

          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent

      - name: Import GPG key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "❌ GPG_PRIVATE_KEY secret is empty"
            exit 1
          fi

          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import

          KEY_FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [[ -z "${KEY_FPR:-}" ]]; then
            echo "❌ No secret key fingerprint found after import"
            gpg --list-secret-keys || true
            exit 1
          fi

          echo "Imported signing key: ${KEY_FPR}"

          # Mark key as ultimately trusted for non-interactive signing
          echo "${KEY_FPR}:6:" | gpg --batch --import-ownertrust

      - name: Build and test (preflight)
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q -Prelease clean verify

      - name: Sanity check coordinates
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q -Dexec.executable=echo -Dexec.args='${project.groupId}:${project.artifactId}:${project.version}' \
            --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec

      - name: Inspect built artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -lah async-bulkhead/target | sed -n '1,200p'

      - name: Release to Maven Central
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          test -f pom.xml || (echo "❌ Not at repo root" && exit 1)
          mvn -Prelease -B -e -DskipTests \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
            deploy

      - name: Finalize Central publishing (manual upload trigger)
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          CENTRAL_NAMESPACE: io.github.janbalangue
        run: |
          set -euo pipefail

          if [[ -z "${CENTRAL_USERNAME:-}" || -z "${CENTRAL_PASSWORD:-}" ]]; then
            echo "❌ CENTRAL_USERNAME/CENTRAL_PASSWORD missing"
            exit 1
          fi

          if [[ -z "${CENTRAL_NAMESPACE:-}" ]]; then
            echo "❌ CENTRAL_NAMESPACE missing"
            exit 1
          fi

          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w 0)"

          curl -sS -X POST \
            -H "Authorization: Bearer $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${CENTRAL_NAMESPACE}?publishing_type=automatic"

  # A separate job so that only this one can write to the repo, and so that a
  # failure here can be rerun without touching Central.
  github-release:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The finalize step doesn't check Central's response, so a green publish job
      # doesn't prove the version got there. 0.6.1 took about three hours to appear.
      # If this times out, rerun this job once the version is available.
      - name: Wait for Maven Central
        timeout-minutes: 240
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          POM_URL="https://repo1.maven.org/maven2/io/github/janbalangue/async-bulkhead/${VERSION}/async-bulkhead-${VERSION}.pom"

          until curl -fsS -o /dev/null "$POM_URL"; do
            echo "Waiting for ${VERSION} on Maven Central"
            sleep 60
          done

          echo "✅ ${VERSION} is on Maven Central"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "✅ Release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

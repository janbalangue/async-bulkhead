name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel superseded runs for the same PR/branch ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q verify

      # Same lookup as the release workflow, so a problem with it fails here
      # instead of after a tag has been pushed.
      - name: Check release version lookup
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive \
            org.codehaus.mojo:exec-maven-plugin:3.1.0:exec

      # Same notes lookup as the release workflow, so a release commit with no
      # changelog section fails here instead of after it has been published.
      - name: Check release notes lookup
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(mvn -B -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive \
            org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)"

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "Skipping $VERSION, which can't be released"
            exit 0
          fi

          bash .github/scripts/release-notes.sh "$VERSION"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**
            **/target/jacoco.exec
            **/target/site/jacoco/jacoco.xml

      - name: JaCoCo summary
        if: always()
        uses: madrapps/jacoco-report@v1.7.0
        with:
          paths: |
            **/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0

  # Releases are built on Java 17, so also run the tests on the newer LTS
  # versions people will use them on.
  compatibility:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ "21", "25" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q verify
